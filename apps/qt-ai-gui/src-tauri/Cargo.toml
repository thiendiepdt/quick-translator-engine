[package]
name = "qt-ai-gui"
version = "1.0.6"
edition = "2021"
license = "GPL-3.0-only"
description = "Desktop GUI for batch AI translation through the Antigravity CLI"

[lib]
name = "qt_ai_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tên file exe người dùng thấy (VNCVT-AI-Translator.exe); tên package qt-ai-gui giữ cho cargo/npm.
[[bin]]
name = "VNCVT-AI-Translator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qt-ai-core = { path = "../../../crates/qt-ai-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
