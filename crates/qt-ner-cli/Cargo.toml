[package]
name = "qt-ner-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[features]
default = ["onnx"]
onnx = ["qt-ner-api/onnx"]

[[bin]]
name = "qt-ner-cli"
path = "src/main.rs"

[dependencies]
qt-core = { path = "../qt-core" }
qt-ner-api = { path = "../qt-ner-api", default-features = false }
axum = "0.7"
http-body-util = "0.1"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
