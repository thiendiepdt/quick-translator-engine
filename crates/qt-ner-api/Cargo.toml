[package]
name = "qt-ner-api"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[features]
default = ["onnx"]
onnx = ["qt-api/onnx"]

[[bin]]
name = "qt-ner-api"
path = "src/main.rs"

[dependencies]
qt-api = { path = "../qt-api" }
qt-core = { path = "../qt-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
