[package]
name = "qt-ai-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Rust port of qt-ai-cli: batch AI translation harness driven through the Antigravity CLI"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
aho-corasick = "1"
fancy-regex = "0.18.0"
thiserror = "2"
# API key mode: gọi Gemini / OpenAI-compatible thẳng. rustls + ring để build Windows không cần OpenSSL/cmake/NASM.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Export EPUB: zip có nén deflate (flate2/miniz_oxide đã có trong lock qua updater).
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
# zip bật flate2 không kèm backend: chọn miniz_oxide (Rust thuần, đã có trong lock).
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
# Phồn → giản theo luật MediaWiki zh-CN (cụm từ, từ vựng Đài Loan → Đại lục); GPL-2.0+ hợp với GPL-3.
zhconv = { version = "0.4", default-features = false, features = ["compress", "mediawiki-hans", "mediawiki-cn"] }
# Đọc file text GBK / Big5 / UTF-16 (raw tải từ web Trung, Đài): đoán mã hoá rồi giải mã.
encoding_rs = "0.8"
chardetng = "1"

[target.'cfg(windows)'.dependencies]
# Job Object KILL_ON_JOB_CLOSE: app chết thì agy chết theo (child_guard). Bản 0.61 đã có trong lock.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
# process_group + PR_SET_PDEATHSIG, kill nhóm tiến trình (child_guard).
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "qt-ai"
path = "src/bin/qt-ai.rs"

[[bin]]
name = "fake-agy"
path = "src/bin/fake-agy.rs"
