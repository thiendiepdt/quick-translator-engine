[package]
name = "qt-lambda"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[features]
default = []
onnx = ["qt-api/onnx"]

[[bin]]
name = "qt-lambda"
path = "src/main.rs"

[dependencies]
qt-api = { path = "../qt-api" }
qt-core = { path = "../qt-core" }
lambda_http = "1.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[package.metadata.lambda.deploy]
memory = 1769
timeout = 30
env = { "RUST_LOG" = "info" }
