[package]
name = "qt-api"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "qt-server"
path = "src/main.rs"

[dependencies]
qt-core = { path = "../qt-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
