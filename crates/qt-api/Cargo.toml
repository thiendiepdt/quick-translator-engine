[package]
name = "qt-api"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[features]
default = []
onnx = ["dep:ort", "dep:tokenizers"]

[[bin]]
name = "qt-server"
path = "src/main.rs"

[dependencies]
qt-core = { path = "../qt-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["std", "load-dynamic", "api-24"] }
tokenizers = { version = "0.23.1", optional = true, default-features = false, features = ["onig"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
