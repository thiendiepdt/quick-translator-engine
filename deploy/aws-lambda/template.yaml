AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Quick Translator Engine on AWS Lambda

Parameters:
  FunctionName:
    Type: String
    Default: quick-translator-engine
  FunctionUrlAuthType:
    Type: String
    Default: AWS_IAM
    AllowedValues:
      - AWS_IAM
      - NONE
  FunctionArchitecture:
    Type: String
    Default: arm64
    AllowedValues:
      - arm64
      - x86_64
  FunctionMemorySize:
    Type: Number
    Default: 1769
    MinValue: 512
    MaxValue: 10240
  ReservedConcurrency:
    Type: Number
    Default: 50
    MinValue: 1
  # The server no longer calls AI providers (clients do), so requests are
  # CPU-bound and finish in well under a second; 30s leaves margin for the
  # largest allowed payloads.
  FunctionTimeout:
    Type: Number
    Default: 30
    MinValue: 3
    MaxValue: 900

Resources:
  QuickTranslatorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
      BuildProperties:
        Binary: qt-lambda
    Properties:
      FunctionName: !Ref FunctionName
      Description: Dictionary-based Chinese to Vietnamese translation API
      CodeUri: ../../
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - !Ref FunctionArchitecture
      MemorySize: !Ref FunctionMemorySize
      Timeout: !Ref FunctionTimeout
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Tracing: PassThrough
      Environment:
        Variables:
          RUST_LOG: info
      FunctionUrlConfig:
        AuthType: !Ref FunctionUrlAuthType
        InvokeMode: BUFFERED

  QuickTranslatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FunctionName}
      RetentionInDays: 14

Outputs:
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt QuickTranslatorFunction.Arn
  FunctionUrl:
    Description: Lambda Function URL
    Value: !GetAtt QuickTranslatorFunctionUrl.FunctionUrl
